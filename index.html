<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width,initial-scale=1">
   <title>Rahim's Bakery</title>
   <style>
     body{
        font-family:Arial, sans-serif;
        max-width: 500px;
        font-size: 20px;
        margin:0 auto;
        padding:20px;
        background:#fff8f0;
        color:#333;
     }
     h1{color:white;
        margin:0 0 8px;
        }
     header{
        background:#8b4a14;
        color:white;
        padding:10px 20px;
        text-align:center;
        border-radius: 8px;
     }
     .item{
        display:flex;
        justify-content: space-between;
        background: white;
        padding:10px;
        margin-bottom:10px;
        border-radius: 30px;
     }
     img {
      width: 100%;
      height: 300px;
      object-fit:cover;
      object-position: center;
      border-radius: 12px;
      margin:15px 0 20px;
     }
     a{
        display:inline-block;
        background:#25d366;
        color:white;
        padding:12px 20px;
        border-radius:50px;
        text-decoration:none;
     }
   </style>
</head>
<body>
    <header>
    <h1>Rahim's Bakery</h1>
    <p>Fresh cakes and snacks, made at home in Mymensingh.</p>
    </header>
    <img src="cake.jpg" alt="Chocolate cake">
    <h3>Opening Hours</h3>
     <p>9am-9pm</p>
    <h2>Menu</h2>

        <span>Cupcake</span>
        <strong>90 taka</strong>
